        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;

            min-height: 100vh;
            -webkit-font-smoothing: antialiased;

            background-color: rgba(0,0,0,0.55);
            padding: 18px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .brand {
            display:flex;
            align-items:center;
            gap:12px;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            color: var(--accent);
            margin: 0;
            letter-spacing: 0.4px;
        }

        header p { margin: 0; color: var(--muted); font-size: 13px; }

        .search { margin-left: auto; }

        #search-bar {
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.03);
            color: #fff;
            outline: none;
            width: 220px;
            transition: width 0.25s ease, background 0.25s ease;
        }
        #search-bar::placeholder { color: rgba(255,255,255,0.5); }
        #search-bar:focus { width: 320px; background: rgba(255,255,255,0.04); }

        main {
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            flex: 1;
        }

        /* Tabs */
        .tabs {
            width: 100%;
            max-width: 1200px;
            display:flex;
            gap:8px;
            background: transparent;
            margin-bottom: 12px;
        }
        .tab-button {
            flex: 0 0 auto;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.06);
            background: var(--tab-bg);
            color: var(--muted);
            cursor: pointer;
            font-weight:600;
        }
        .tab-button.active {
            background: linear-gradient(90deg,var(--accent),var(--accent-dark));
            color: #fff;
            border-color: rgba(0,0,0,0.2);
            box-shadow: 0 8px 18px rgba(0,0,0,0.45);
        }

        /* Music list */
        #music-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 28px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .song-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.35)), var(--card-bg);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        .song-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.6);
        }

        .song-card img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 8px 18px rgba(0,0,0,0.6);
            border: 5px solid var(--accent);
            transition: transform 0.4s ease;
        }

        .rotating { animation: rotateVinyl 5s linear infinite; transform-origin: 50% 50%; }

        .song-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin: 12px 0;
        }

        .audio-controls { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:8px; width:100%; }
        .control-row { display:flex; gap:8px; width:100%; align-items:center; justify-content:center; }

        .play-button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .download-button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .volume-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.07);
            border-radius: 999px;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            cursor: pointer;

        .progress-container { width: 100%; height: 6px; background-color: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; }

        .time-display { font-size: 12px; color: var(--muted); }

        #videos-section {

            max-width: 1200px;
            background: transparent;

        .yt-grid {

            align-items: start;

            padding: 12px;

            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }
        .player-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

            flex-direction:column;
            gap:10px;
            margin-top:10px;
        }

        .video-title {

            font-weight:700;
            color:#fff;
            margin:0;

        .suggest-thumb {

        .suggest-info { flex:1; display:flex; flex-direction:column; gap:4px; }

        .suggest-meta { font-size:12px; color:var(--muted); }

        .video-list { display:none; }

        /* Tab panel */
        .tab-panel { display: none; width:100%; }
        .tab-panel.active { display: block; }

        footer {

            border-top: 1px solid rgba(255,255,255,0.02);

            .suggest-item { gap:8px; }
            .suggest-thumb { flex-basis: 45%; width:45%; }
            #search-bar { width: 140px; }
            #search-bar:focus { width: 200px; }
        }
    </style>
</head>

    // --- Utilities ---
    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function formatTime(seconds) {
        if (!isFinite(seconds)) return '0:00';
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
    }

                        <input type="range" min="0" max="1" step="0.05" value="${currentVolume}" class="volume-slider" oninput="adjustVolume('${song.id}', this.value)" title="Volume">
                    </div>
                    <div class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="progress-bar" id="progress-${song.id}"></div>
                    </div>
                    <div class="time-display">
                        <span id="current-${song.id}">0:00</span> / <span id="duration-${song.id}">0:00</span>
                    </div>
                </div>
                <audio id="${song.id}" src="${song.audio}" onloadedmetadata="setDuration('${song.id}')" ontimeupdate="updateProgress('${song.id}')"></audio>
            </div>
        `;
    }

    // --- Video suggestion generation (YouTube-like items) ---
    function createSuggestItem(video) {
        const thumb = `https://img.youtube.com/vi/${video.embedId}/mqdefault.jpg`;
        return `
            <div class="suggest-item" role="button" tabindex="0" onclick="setFeaturedVideo('${video.embedId}','${escapeHtml(video.title)}', '${escapeHtml(video.desc)}','${escapeHtml(video.views)}','${escapeHtml(video.date)}')" onkeydown="if(event.key==='Enter' || event.key===' ') setFeaturedVideo('${video.embedId}','${escapeHtml(video.title)}', '${escapeHtml(video.desc)}','${escapeHtml(video.views)}','${escapeHtml(video.date)}')">
                <div class="suggest-thumb"><img src="${thumb}" alt="${escapeHtml(video.title)} thumbnail"></div>
                <div class="suggest-info">
                    <p class="suggest-title">${escapeHtml(video.title)}</p>
                    <p class="suggest-meta">${escapeHtml(video.views)} vizualizări • ${escapeHtml(video.date)}</p>
                </div>
            </div>
        `;
    }

    // --- Featured video setter ---
    function setFeaturedVideo(embedId, title, desc = '', views = '0', date = '') {
        const iframe = document.getElementById('featured-video');
        const titleEl = document.getElementById('featured-title');
        const descEl = document.getElementById('featured-desc');
        const viewsEl = document.getElementById('featured-views');
        const dateEl = document.getElementById('featured-date');

        if (!iframe) return;
        // Use YouTube embed params similar to YouTube: show controls, modestbranding
        iframe.src = `https://www.youtube.com/embed/${embedId}?rel=0&autoplay=1&controls=1&modestbranding=1`;
        if (titleEl) titleEl.textContent = title || 'Videoclip';
        if (descEl) descEl.textContent = desc || 'Descriere videoclip';
        if (viewsEl) viewsEl.textContent = `${views} vizualizări`;
        if (dateEl) dateEl.textContent = date || '';
        // scroll player into view on small screens
        iframe.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // --- Audio helpers (kept) ---
    window.setDuration = function(audioId) {
        const audio = document.getElementById(audioId);
        const durationElement = document.getElementById(`duration-${audioId}`);
        if (audio && durationElement) durationElement.textContent = formatTime(audio.duration);
    };

    window.updateProgress = function(audioId) {
        const audio = document.getElementById(audioId);
        const progressBar = document.getElementById(`progress-${audioId}`);
        const currentTimeElement = document.getElementById(`current-${audioId}`);
        if (!audio || !progressBar || !currentTimeElement) return;
        const progress = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
        progressBar.style.width = `${progress}%`;
        currentTimeElement.textContent = formatTime(audio.currentTime);
    };

    window.adjustVolume = function(audioId, value) {
        const audio = document.getElementById(audioId);
        currentVolume = parseFloat(value);
        if (audio) audio.volume = currentVolume;
    };

    window.playAudio = function(audioId, imageId) {
        const audio = document.getElementById(audioId);
        const image = document.getElementById(imageId);
        const button = document.querySelector(`#card-${audioId} .play-button`);
        if (!audio) return;

        if (currentlyPlaying && currentlyPlaying !== audio) {
            currentlyPlaying.pause();
            const currentImage = document.getElementById(`image${currentlyPlaying.id.replace('audio', '')}`);
            const currentButton = document.querySelector(`#card-${currentlyPlaying.id} .play-button`);
            if (currentImage) currentImage.classList.remove("rotating");
            if (currentButton) currentButton.textContent = "Play";
        }

        if (audio.paused) {
            audio.play().catch(()=>{ /* Autoplay may be blocked until user interacts — user can click Play */ });
            if (image) image.classList.add("rotating");
            if (button) button.textContent = "Pause";
            currentlyPlaying = audio;
            audio.volume = currentVolume;
        } else {
            audio.pause();
            if (image) image.classList.remove("rotating");
            if (button) button.textContent = "Play";
            currentlyPlaying = null;
        }

        audio.addEventListener('ended', () => {
            if (image) image.classList.remove("rotating");
            if (button) button.textContent = "Play";
            currentlyPlaying = null;
            const currentIndex = songs.findIndex(song => song.id === audioId);
            const nextIndex = (currentIndex + 1) % songs.length;
            const nextSong = songs[nextIndex];
            if (nextSong) playAudio(nextSong.id, `image${nextSong.id.replace('audio', '')}`);
        }, { once: true });
    };

    // --- Tab logic ---
    function setActiveTab(tabName) {
        const tabButtons = document.querySelectorAll('.tab-button');
        tabButtons.forEach(btn => {
            const isActive = btn.dataset.tab === tabName;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        document.querySelectorAll('.tab-panel').forEach(panel => {
            panel.classList.toggle('active', panel.id === `tab-${tabName}`);
        });

        const search = document.getElementById('search-bar');
        if (search) {
            search.placeholder = tabName === 'videos' ? 'Caută videoclipuri...' : 'Caută piese...';
            search.value = '';
            const event = new Event('input', { bubbles: true });
            search.dispatchEvent(event);
        }
    }

    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
    });

    // Tab keyboard navigation
    document.addEventListener('keydown', (e) => {
        const focused = document.activeElement;
        if (!focused || !focused.classList.contains('tab-button')) return;
        const tabs = Array.from(document.querySelectorAll('.tab-button'));
        const idx = tabs.indexOf(focused);
        if (e.key === 'ArrowRight') { tabs[(idx + 1) % tabs.length].focus(); }
        if (e.key === 'ArrowLeft') { tabs[(idx - 1 + tabs.length) % tabs.length].focus(); }
        if (e.key === 'Home') { tabs[0].focus(); }
        if (e.key === 'End') { tabs[tabs.length - 1].focus(); }
    });

    // Audio keyboard shortcuts (kept)
    document.addEventListener('keydown', (e) => {
        if (!currentlyPlaying) return;
        switch(e.code) {
            case 'Space':
                e.preventDefault();
                const btn = document.querySelector(`#card-${currentlyPlaying.id} .play-button`);
                if (btn) btn.click();
                break;
            case 'ArrowUp':
                e.preventDefault();
                currentVolume = Math.min(1, currentVolume + 0.1);
                adjustVolume(currentlyPlaying.id, currentVolume);
                break;
            case 'ArrowDown':
                e.preventDefault();
                currentVolume = Math.max(0, currentVolume - 0.1);
                adjustVolume(currentlyPlaying.id, currentVolume);
                break;
        }
    });

    // --- DOMContentLoaded: render lists, initialize featured video ---
    document.addEventListener('DOMContentLoaded', () => {
        const musicList = document.getElementById('music-list');
        const suggestions = document.getElementById('suggestions');

        if (musicList) musicList.innerHTML = songs.map(createSongCard).join('');
        if (suggestions) suggestions.innerHTML = youtubeVideos.map(createSuggestItem).join('');

        // Autoplay dezactivat la încărcare — nu selectăm automat primul videoclip

        // Search functionality: filters only visible tab content
        const searchInput = document.getElementById('search-bar');
        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase().trim();
                const activeTabBtn = document.querySelector('.tab-button.active');
                const activeTab = activeTabBtn ? activeTabBtn.dataset.tab : 'songs';

                if (activeTab === 'songs') {
                    const songCards = document.querySelectorAll('.song-card');
                    songCards.forEach(card => {
                        const titleEl = card.querySelector('.song-title');
                        const title = titleEl ? titleEl.textContent.toLowerCase() : '';
                        card.style.display = title.includes(query) ? '' : 'none';
                    });
                } else {
                    const suggestItems = document.querySelectorAll('.suggest-item');
                    suggestItems.forEach(item => {
                        const titleEl = item.querySelector('.suggest-title');
                        const title = titleEl ? titleEl.textContent.toLowerCase() : '';
                        item.style.display = title.includes(query) ? '' : 'none';
                    });
                }
            });
        }

        // Description toggle
        const descToggle = document.getElementById('desc-toggle');
        const descEl = document.getElementById('featured-desc');
        if (descToggle && descEl) {
            descToggle.addEventListener('click', () => {
                if (descEl.style.maxHeight && descEl.style.maxHeight !== '110px') {
                    descEl.style.maxHeight = '110px';
                    descToggle.textContent = 'Arată mai mult';
                } else {
                    descEl.style.maxHeight = '1000px';
                    descToggle.textContent = 'Arată mai puțin';
                }
            });
        }

        // Subscribe button (visual only)
        const subBtn = document.getElementById('subscribe-btn');
        if (subBtn) {
            subBtn.addEventListener('click', () => {
                subBtn.textContent = subBtn.textContent === 'Abonează-te' ? 'Abonat' : 'Abonează-te';
                subBtn.style.background = subBtn.textContent === 'Abonat' ? 'rgba(255,255,255,0.08)' : '#ff3b3b';
            });
        }
    });
    </script>
</body>
</html>
