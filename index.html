:root{
    --accent: #ff3b3b;
    --accent-dark: #cc2a2a;
    --card-bg: rgba(12,10,10,0.62);
    --muted: rgba(255,255,255,0.72);
    --tab-bg: rgba(255,255,255,0.02);
    --yt-like-bg: rgba(8,8,8,0.7);
    --glass: rgba(255,255,255,0.03);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#fff;background:#070707;}
body::before{content:"";position:fixed;inset:0;background-image:url('Selena.jpg');background-size:cover;background-position:center;filter:blur(28px) saturate(0.8) contrast(0.95);transform:scale(1.06);z-index:0;opacity:1;}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center, rgba(255,50,50,0.12), rgba(0,0,0,0.45));mix-blend-mode:overlay;z-index:1;pointer-events:none;animation:slowPulse 8s ease-in-out infinite;}
@keyframes slowPulse{0%{opacity:0.9}50%{opacity:0.78}100%{opacity:0.9}}
.page{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100vh;backdrop-filter:blur(6px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;background:linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.25));border-bottom:1px solid rgba(255,255,255,0.03);box-shadow:0 6px 20px rgba(0,0,0,0.6)}
.brand{display:flex;gap:12px;align-items:center}
.brand img{width:48px;height:48px;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,0.06)}
header h1{margin:0;font-size:20px;color:var(--accent);letter-spacing:0.4px}
header p{margin:0;font-size:12px;color:var(--muted)}
#search-bar{width:220px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.06);background:var(--glass);color:#fff;outline:none;transition:width .25s ease}
#search-bar::placeholder{color:rgba(255,255,255,0.5)}#search-bar:focus{width:340px}
main{padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px;flex:1}
.tabs{width:100%;max-width:1200px;display:flex;gap:8px;z-index:3}
.tab-button{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.06);background:var(--tab-bg);color:var(--muted);cursor:pointer;font-weight:700}
.tab-button.active{background:linear-gradient(90deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 8px 20px rgba(204,42,42,0.18)}
#music-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;width:100%;max-width:1200px;z-index:3}
.song-card{background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.4));border-radius:16px;padding:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.6);transition:transform .22s ease,box-shadow .22s ease}
.song-card:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(0,0,0,0.6)}
.song-card img{width:150px;height:150px;object-fit:cover;border-radius:50%;margin:0 auto;display:block;border:6px solid rgba(255,255,255,0.04);transition:box-shadow .28s ease, transform .4s ease;box-shadow:0 8px 20px rgba(0,0,0,0.6);background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.03), transparent)}
.rotating{animation:rotateVinyl 5s linear infinite;transform-origin:50% 50%;box-shadow:0 8px 32px rgba(255,50,50,0.18),0 2px 8px rgba(0,0,0,0.6)}
.glow-red{box-shadow:0 0 24px rgba(255,60,60,0.35),0 8px 30px rgba(0,0,0,0.6);border-color:rgba(255,120,120,0.12)}
@keyframes rotateVinyl{to{transform:rotate(360deg)}}
.song-title{margin:12px 0 8px;font-weight:700;font-size:15px;color:#fff}
.audio-controls{display:flex;flex-direction:column;gap:10px;align-items:center}
.play-button{background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#fff;border:none;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:800;box-shadow:0 6px 18px rgba(204,42,42,0.18)}
.play-button:active{transform:translateY(1px)}
.download-button{display:inline-block;border-radius:999px;padding:8px 12px;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,0.06);color:var(--accent);background:transparent}
.volume-slider{width:100%;height:6px;-webkit-appearance:none;background:rgba(255,255,255,0.06);border-radius:999px}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.progress-container{width:100%;height:8px;background:rgba(255,255,255,0.04);border-radius:999px;overflow:hidden}
.progress-bar{width:0;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));transition:width .12s linear}
.time-display{font-size:12px;color:var(--muted)}
#videos-section{width:100%;max-width:1200px;z-index:3}
.yt-grid{display:grid;grid-template-columns:1fr 360px;gap:16px}
.video-player{background:linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.35));border-radius:12px;padding:12px;transition:box-shadow .22s ease, transform .22s ease}
.player-frame{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;background:rgba(0,0,0,0.6)}
.player-frame::before{content:"";position:absolute;inset:0;z-index:0;background-image:url('Selena.jpg');background-size:cover;background-position:center;filter:blur(18px) brightness(0.6) saturate(.9);transform:scale(1.08);opacity:0.9}
.player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1;border-radius:8px}
.video-meta{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.video-title{font-size:18px;font-weight:800;margin:0;color:#fff}
.channel-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.channel-info{display:flex;gap:10px;align-items:center}
.channel-avatar{width:44px;height:44px;border-radius:8px;object-fit:cover;border:2px solid rgba(255,255,255,0.04)}
.channel-name{color:var(--muted);font-weight:700;font-size:14px}
.stats-row{color:var(--muted);font-size:13px}
.action-row{display:flex;gap:8px}
.yt-btn{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}
.video-description{color:var(--muted);font-size:14px;line-height:1.4;max-height:120px;overflow:hidden}
.suggestions{display:flex;flex-direction:column;gap:12px}
.suggest-item{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px;border-radius:8px;transition:background .12s ease, transform .12s ease}
.suggest-item:hover{background:rgba(255,255,255,0.02);transform:translateX(6px)}
.suggest-thumb{flex:0 0 44%;height:64px;border-radius:6px;overflow:hidden;background:#000}
.suggest-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.suggest-title{margin:0;font-weight:800;font-size:13px;color:#fff}
.suggest-meta{font-size:12px;color:var(--muted)}
.tab-panel{display:none;width:100%}
.tab-panel.active{display:block}
footer{position:relative;z-index:3;background:rgba(0,0,0,0.65);color:var(--muted);text-align:center;padding:12px;font-size:13px;border-top:1px solid rgba(255,255,255,0.02)}
/* bara youtube mică in dreapta jos */
#yt-bar{position:fixed;right:18px;bottom:18px;z-index:4;background:linear-gradient(90deg,var(--accent),var(--accent-dark));padding:8px 12px;border-radius:18px;box-shadow:0 0 20px rgba(255,60,60,0.4);display:flex;align-items:center;gap:8px;opacity:0;animation:fadeInBar .5s forwards .8s;font-size:13px}
#yt-bar .bar-link{color:#fff;font-weight:600;text-decoration:none;display:flex;gap:8px;align-items:center}
#yt-bar .pulse{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.95);box-shadow:0 0 14px rgba(255,60,60,0.9);animation:barPulse 1.6s infinite}
@keyframes fadeInBar{to{opacity:1}}
@keyframes barPulse{0%{transform:scale(0.9);opacity:0.9}50%{transform:scale(1.25);opacity:1}100%{transform:scale(0.9);opacity:0.9}}
@media(max-width:900px){.yt-grid{grid-template-columns:1fr}.suggest-thumb{flex-basis:40%;width:40%}#search-bar{width:140px}#search-bar:focus{width:220px}#yt-bar{right:14px;bottom:14px;border-radius:12px}}
</style>

#instagram-qr img:hover {

</style>

                <button onclick="playAudio('${song.id}','image${song.id.replace('audio','')}')" class="play-button">Play</button>
                <a class="download-button" href="${encodeURI(song.audio)}" download="${encodeURI(safeFilename)}" title="Descarcă ${escapeHtml(song.title)}">Descarcă</a>
            </div>
            <div style="width:100%"><input type="range" min="0" max="1" step="0.05" value="${currentVolume}" class="volume-slider" oninput="adjustVolume('${song.id}', this.value)"></div>
            <div class="progress-container"><div class="progress-bar" id="progress-${song.id}"></div></div>
            <div class="time-display"><span id="current-${song.id}">0:00</span> / <span id="duration-${song.id}">0:00</span></div>
        </div>
        <audio id="${song.id}" src="${song.audio}" preload="none" onloadedmetadata="setDuration('${song.id}')" ontimeupdate="updateProgress('${song.id}')"></audio>
    </div>
`;}
function createSuggestItem(video){const thumb = `https://img.youtube.com/vi/${video.embedId}/mqdefault.jpg`;return `
    <div class="suggest-item" role="button" tabindex="0" onclick="setFeaturedVideo('${video.embedId}','${escapeHtml(video.title)}','${escapeHtml(video.desc)}','${escapeHtml(video.views)}','${escapeHtml(video.date)}')" onkeydown="if(event.key==='Enter' || event.key===' ') setFeaturedVideo('${video.embedId}','${escapeHtml(video.title)}','${escapeHtml(video.desc)}','${escapeHtml(video.views)}','${escapeHtml(video.date)}')">
        <div class="suggest-thumb"><img src="${thumb}" alt="${escapeHtml(video.title)} thumbnail"></div>
        <div class="suggest-info">
            <p class="suggest-title">${escapeHtml(video.title)}</p>
            <p class="suggest-meta">${escapeHtml(video.views)} • ${escapeHtml(video.date)}</p>
        </div>
    </div>
`;}
function setFeaturedVideo(embedId, title, desc = '', views = '0', date = ''){const iframe = document.getElementById('featured-video');const titleEl = document.getElementById('featured-title');const descEl = document.getElementById('featured-desc');const viewsEl = document.getElementById('featured-views');const dateEl = document.getElementById('featured-date');playClick();if(!iframe) return;iframe.style.opacity = 0;setTimeout(()=>{iframe.src = `https://www.youtube.com/embed/${embedId}?rel=0&autoplay=1&controls=1&modestbranding=1`;titleEl.textContent = title || 'Videoclip';descEl.textContent = desc || '';viewsEl.textContent = views || '0';dateEl.textContent = date || '';iframe.style.opacity = 1;iframe.scrollIntoView({ behavior: 'smooth', block: 'center' });},220);}
window.setDuration = function(audioId){const audio = document.getElementById(audioId);const durationElement = document.getElementById(`duration-${audioId}`);if(audio && durationElement && audio.duration) durationElement.textContent = formatTime(audio.duration);};
window.updateProgress = function(audioId){const audio = document.getElementById(audioId);const progressBar = document.getElementById(`progress-${audioId}`);const currentTimeElement = document.getElementById(`current-${audioId}`);if(!audio||!progressBar||!currentTimeElement) return;const progress = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;progressBar.style.width = `${progress}%`;currentTimeElement.textContent = formatTime(audio.currentTime);};
window.adjustVolume = function(audioId,value){const audio=document.getElementById(audioId);currentVolume=parseFloat(value);if(audio) audio.volume=currentVolume;};
window.playAudio = function(audioId,imageId){const audio=document.getElementById(audioId);const image=document.getElementById(imageId);const button=document.querySelector(`#card-${audioId} .play-button`);if(!audio) return;playIntroOnce();if(currentlyPlaying && currentlyPlaying!==audio){currentlyPlaying.pause();const currentImage=document.getElementById(`image${currentlyPlaying.id.replace('audio','')}`);const currentButton=document.querySelector(`#card-${currentlyPlaying.id} .play-button`);if(currentImage){currentImage.classList.remove('rotating','glow-red')}if(currentButton) currentButton.textContent='Play'}if(audio.paused){audio.play().catch(()=>{});if(image){image.classList.add('rotating','glow-red')}if(button) button.textContent='Pause';currentlyPlaying=audio;audio.volume=currentVolume}else{audio.pause();if(image){image.classList.remove('rotating','glow-red')}if(button) button.textContent='Play';currentlyPlaying=null}audio.addEventListener('ended',()=>{if(image) image.classList.remove('rotating','glow-red');if(button) button.textContent='Play';currentlyPlaying=null;const idx=songs.findIndex(s=>s.id===audioId);const next=songs[(idx+1)%songs.length];if(next) setTimeout(()=>{playAudio(next.id, `image${next.id.replace('audio','')}`)},400);},{once:true});playClick();};
function playClick(){const c=document.getElementById('click-audio');if(!c) return;try{c.currentTime=0;c.play().catch(()=>{});}catch(e){}}
function playIntroOnce(){if(introPlayed) return;introPlayed=true;const intro=document.getElementById('intro-audio');if(!intro) return;try{intro.currentTime=0;intro.play().catch(()=>{});}catch(e){}}
function setActiveTab(tabName){document.querySelectorAll('.tab-button').forEach(btn=>{const isActive = btn.dataset.tab===tabName;btn.classList.toggle('active', isActive);btn.setAttribute('aria-selected', isActive ? 'true' : 'false');});document.querySelectorAll('.tab-panel').forEach(panel=>{panel.classList.toggle('active', panel.id==='tab-'+tabName)});const search=document.getElementById('search-bar');if(search){search.placeholder = tabName==='videos' ? 'Caută videoclipuri...' : 'Caută piese...';search.value='';search.dispatchEvent(new Event('input'))}playClick()}
document.querySelectorAll('.tab-button').forEach(btn=>{btn.addEventListener('click',()=>setActiveTab(btn.dataset.tab))})
document.addEventListener('keydown',(e)=>{const focused=document.activeElement; if(!focused||!focused.classList.contains('tab-button')) return; const tabs=Array.from(document.querySelectorAll('.tab-button')); const idx=tabs.indexOf(focused); if(e.key==='ArrowRight') tabs[(idx+1)%tabs.length].focus(); if(e.key==='ArrowLeft') tabs[(idx-1+tabs.length)%tabs.length].focus(); if(e.key==='Home') tabs[0].focus(); if(e.key==='End') tabs[tabs.length-1].focus();})
document.addEventListener('keydown',(e)=>{if(!currentlyPlaying) return;switch(e.code){case 'Space':e.preventDefault();const btn=document.querySelector(`#card-${currentlyPlaying.id} .play-button`);if(btn) btn.click();break;case 'ArrowUp':e.preventDefault();currentVolume=Math.min(1,currentVolume+0.1);adjustVolume(currentlyPlaying.id,currentVolume);break;case 'ArrowDown':e.preventDefault();currentVolume=Math.max(0,currentVolume-0.1);adjustVolume(currentlyPlaying.id,currentVolume);break;}})
function applySearch(query){query=(query||'').toLowerCase().trim();const activeTabBtn=document.querySelector('.tab-button.active');const activeTab=activeTabBtn?activeTabBtn.dataset.tab:'songs';if(activeTab==='songs'){document.querySelectorAll('.song-card').forEach(card=>{const title=(card.querySelector('.song-title')?.textContent||'').toLowerCase();card.style.display = title.includes(query) ? '' : 'none';});}else{document.querySelectorAll('.suggest-item').forEach(item=>{const title=(item.querySelector('.suggest-title')?.textContent||'').toLowerCase();item.style.display = title.includes(query) ? '' : 'none';});}}
document.getElementById('search-bar').addEventListener('input',(e)=>applySearch(e.target.value))
document.getElementById('desc-toggle').addEventListener('click',()=>{const desc=document.getElementById('featured-desc');if(!desc) return; if(desc.style.maxHeight && desc.style.maxHeight!=='120px'){desc.style.maxHeight='120px';document.getElementById('desc-toggle').textContent='Arată mai mult'}else{desc.style.maxHeight='1000px';document.getElementById('desc-toggle').textContent='Arată mai puțin'}playClick()})
document.getElementById('subscribe-btn').addEventListener('click',()=>{const b=document.getElementById('subscribe-btn');b.textContent = b.textContent==='Abonează-te' ? 'Abonat' : 'Abonează-te';b.style.background = b.textContent==='Abonat' ? 'rgba(255,255,255,0.06)' : '';playClick()})
document.addEventListener('DOMContentLoaded',()=>{const musicList=document.getElementById('music-list');const suggestions=document.getElementById('suggestions');if(musicList) musicList.innerHTML = songs.map(createSongCard).join('');if(suggestions) suggestions.innerHTML = youtubeVideos.map(createSuggestItem).join('');if(youtubeVideos.length){const first = youtubeVideos[0];const iframe=document.getElementById('featured-video');if(iframe) iframe.src = `https://www.youtube.com/embed/${first.embedId}?rel=0&controls=1&modestbranding=1`;document.getElementById('featured-title').textContent = first.title;document.getElementById('featured-desc').textContent = first.desc||'';document.getElementById('featured-views').textContent = first.views;document.getElementById('featured-date').textContent = first.date;}document.querySelectorAll('.suggest-item').forEach(item=>{item.addEventListener('keydown',(e)=>{if(e.key==='Enter' || e.key===' '){item.click();e.preventDefault();}})});['click','keydown','touchstart'].forEach(ev=>{window.addEventListener(ev,function firstTouch(){playIntroOnce();['click','keydown','touchstart'].forEach(k=>window.removeEventListener(k, firstTouch));},{once:true,passive:true})});});
</script>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let ytPlayer;
let currentVideoIndex = 0;
function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('featured-video',{events:{'onStateChange': onPlayerStateChange}});
}
const origSet = setFeaturedVideo;
setFeaturedVideo = function(e,t,d,v,da){
  currentVideoIndex = youtubeVideos.findIndex(x=>x.embedId===e);
  origSet(e,t,d,v,da);
};
function onPlayerStateChange(event){
  if(event.data === YT.PlayerState.ENDED){
    hideNextButton();
    currentVideoIndex++;
    if(currentVideoIndex < youtubeVideos.length){
      const next = youtubeVideos[currentVideoIndex];
      origSet(next.embedId,next.title,next.desc,next.views,next.date);
    }
  }
  if(event.data === YT.PlayerState.PLAYING){
    const check = setInterval(()=>{
      if(event.data!==YT.PlayerState.PLAYING) return clearInterval(check);
      const rem = ytPlayer.getDuration()-ytPlayer.getCurrentTime();
      if(rem<10) showNextButton(); else hideNextButton();
    },1000);
  }
}
function showNextButton(){
  const b=document.getElementById('next-overlay');
  if(b){b.style.opacity=1;b.style.transform='translateY(0)';}
}
function hideNextButton(){
  const b=document.getElementById('next-overlay');
  if(b){b.style.opacity=0;b.style.transform='translateY(18px)';}
}
document.addEventListener('DOMContentLoaded',()=>{
  const b=document.getElementById('next-overlay');
  if(b) b.onclick=()=>{
    hideNextButton();
    currentVideoIndex++;
    if(currentVideoIndex < youtubeVideos.length){
      const next = youtubeVideos[currentVideoIndex];
      origSet(next.embedId,next.title,next.desc,next.views,next.date);
    }
  };
});
</script>


<script>
document.addEventListener('DOMContentLoaded',()=>{
  const nextBtn=document.getElementById('next-btn');
  if(nextBtn){
    nextBtn.addEventListener('click',()=>{
      currentVideoIndex++;
      if(currentVideoIndex < youtubeVideos.length){
        const next = youtubeVideos[currentVideoIndex];
        origSet(next.embedId,next.title,next.desc,next.views,next.date);
      }
    });
  }
});
</script>
