<!DOCTYPE html>
<html lang='ro'>
<head>
<meta charset='utf-8' />
<meta name='viewport' content='width=device-width,initial-scale=1' />
<title>AdamMM Music</title>
<link href='https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap' rel='stylesheet'>
<style>
:root{
    --accent:#1db954;
    --accent-dark:#169c46;
    --red-accent:#ff3b3b;
    --card-bg:rgba(30,30,30,0.75);
    --muted:#b3b3b3
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg, rgba(18,18,18,0.6), rgba(18,18,18,0.6)), url('Selena.jpg') center/cover no-repeat fixed;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden
}

/* Header cu logo animat */
header{
    backdrop-filter:blur(6px);
    background:rgba(0,0,0,0.55);
    padding:12px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,0.06)
}
.logo-row{
    display:flex;
    align-items:center;
    gap:12px;
    animation: logoSlideIn 1s ease-out
}
.logo-img{
    width:46px;
    height:46px;
    border-radius:8px;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.06);
    animation: logoPulse 2s ease-in-out infinite
}
.logo-text{
    font-weight:700;
    color:var(--red-accent);
    font-size:18px;
    position:relative
}
.logo-glow{
    animation:glow 2s ease-in-out infinite
}

@keyframes logoSlideIn {
    0% { transform: translateX(-20px); opacity: 0 }
    100% { transform: translateX(0); opacity: 1 }
}
@keyframes logoPulse {
    0%, 100% { transform: scale(1) }
    50% { transform: scale(1.05) }
}
@keyframes glow{
    0%{text-shadow:0 0 0 rgba(255,59,59,0)}
    50%{text-shadow:0 0 18px rgba(255,59,59,0.6)}
    100%{text-shadow:0 0 0 rgba(255,59,59,0)}
}

.container{
    max-width:1200px;
    margin:18px auto;
    padding:18px
}

/* Tabs */
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:14px
}
.tab-btn{
    padding:10px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.06);
    background:rgba(255,255,255,0.03);
    color:var(--muted);
    cursor:pointer;
    font-weight:600;
    transition:all 0.3s ease
}
.tab-btn.active{
    background:linear-gradient(90deg,var(--red-accent),#ff6b6b);
    color:#fff;
    border-color:rgba(0,0,0,0.2)
}

/* Tranziție elegantă între taburi */
.tab-panel{
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.4s ease, transform 0.4s ease;
    display:none
}
.tab-panel.active{
    display:block;
    opacity:1;
    transform:translateY(0)
}

/* Songs grid */
.songs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px
}
.song-card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.35)), var(--card-bg);
    border-radius:14px;
    padding:14px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    transition:transform 0.3s ease
}
.song-card:hover{
    transform:translateY(-5px)
}
.song-card img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid var(--red-accent)
}
.song-title{
    font-weight:700;
    margin-top:10px;
    color:#fff
}

/* audio controls */
.controls{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    margin-top:10px
}
.play-btn{
    background:var(--red-accent);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
    transition:all 0.3s ease
}
.play-btn:hover{
    background:#ff5252;
    transform:scale(1.05)
}
.progress{
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.06);
    border-radius:999px;
    overflow:hidden;
    margin-top:8px
}
.progress-bar{
    width:0;
    height:100%;
    background:var(--red-accent);
    transition:width .12s linear
}

/* Video area (YouTube style) */
.video-shell{
    display:grid;
    grid-template-columns:68% 32%;
    gap:16px;
    align-items:start
}
.player-frame{
    position:relative;
    padding-bottom:56.25%;
    height:0;
    background:#000;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.7)
}
.player-frame iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0
}
.video-meta{
    color:var(--muted);
    margin-top:10px;
    font-size:14px
}

/* video card */
.vcard{
    background:var(--card-bg);
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease
}
.vcard:hover{
    transform:translateY(-6px);
    box-shadow:0 18px 40px rgba(0,0,0,0.6)
}
.vthumb{
    position:relative;
    border-radius:6px;
    overflow:hidden;
    background:#000
}
.vthumb img{
    width:100%;
    height:120px;
    object-fit:cover;
    display:block
}
.vtitle{
    font-weight:700;
    margin-top:8px;
    color:#fff;
    font-size:14px
}
.vmeta{
    color:var(--muted);
    font-size:13px
}

/* Filter buttons */
.filter-buttons{
    display:flex;
    gap:8px;
    margin-bottom:12px
}
.filter-btn{
    padding:6px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.06);
    background:rgba(255,255,255,0.03);
    color:var(--muted);
    cursor:pointer;
    font-size:12px;
    transition:all 0.3s ease
}
.filter-btn.active{
    background:var(--red-accent);
    color:#fff
}

/* Video placeholder */
.video-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
}
.video-placeholder i {
    font-size: 48px;
    margin-bottom: 10px;
    color: var(--red-accent);
}

/* responsive */
@media(max-width:900px){
    .video-shell{grid-template-columns:1fr}
    .video-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .songs-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}

/* Loading animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px) }
    to { opacity: 1; transform: translateY(0) }
}

.song-card, .vcard {
    animation: fadeIn 0.6s ease forwards
}
</style>
</head>

// Tab logic cu tranziție elegantă
function activateTab(name){
    document.querySelectorAll('.tab-panel').forEach(p=>{ 
        p.classList.remove('active');
    });
    const panel = document.getElementById('tab-'+name);
    if(panel){ 
        setTimeout(() => {
            panel.classList.add('active');
        }, 50);
    }
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-btn[data-tab]').forEach(b=>{ 
        if(b.dataset.tab===name) b.classList.add('active'); 
    });
}

// Attach tab clicks

    if(btn){

});

function createSongCard(s){

// Audio handling
let currentAudio = null;
function playAudioById(id){
    if(currentAudio && currentAudio.id === id){
        if(!currentAudio.audio.paused) {
            currentAudio.audio.pause();
            currentAudio.button.textContent = 'Play';
        } else {
            currentAudio.audio.play();
            currentAudio.button.textContent = 'Pause';
        }
        return;
    }
    if(currentAudio){
        currentAudio.audio.pause();
        currentAudio.button.textContent = 'Play';
    }
    const song = SONGS.find(x=>x.id===id);
    if(!song) return;
    let audio = document.getElementById('audio-'+id);
    if(!audio){
        audio = document.createElement('audio');
        audio.id = 'audio-'+id;
        audio.src = song.audio;
        audio.preload = 'none';
        document.body.appendChild(audio);
    }
    const button = document.querySelector(`button[data-audio="${id}"]`);
    audio.volume = 1.0;
    audio.play();
    button.textContent = 'Pause';
    currentAudio = {id:id,audio:audio,button:button};
    audio.ontimeupdate = function(){ 
        const p = document.getElementById('prog-'+id); 
        if(p) p.style.width = ((audio.currentTime/audio.duration)||0)*100 + '%'; 
    }
    audio.onended = function(){ 
        if(button) button.textContent = 'Play'; 
        currentAudio = null; 
        const progressBar = document.getElementById('prog-'+id);
        if(progressBar) progressBar.style.width='0%'; 
    }
}

// Attach play buttons
document.addEventListener('click', function(e){
    const b = e.target.closest('button[data-audio]');
    if(b){
        const id = b.dataset.audio;
        playAudioById(id);
    }
});

function setFeatured(v){

    document.getElementById('featured-meta').textContent = `${v.title} — ${v.views} • ${v.date}`;
    document.querySelector('.player-frame').scrollIntoView({behavior:'smooth'});
}

// Filters (recent/popular)
function parseViews(s){
    if(!s) return 0;
    const m = s.match(/([\d,.]+)\s*/);
    if(!m) return 0;
    const num = m[1].replace(',','.');
    if(s.toUpperCase().includes('K')) return parseFloat(num)*1000;
    if(s.toUpperCase().includes('M')) return parseFloat(num)*1000000;
    return parseInt(num.replace(/[^\d]/g,''))||0;
}

function parseDays(s){
    if(!s) return 0;
    const m = s.match(/acum\s+(\d+)\s*(\w+)/i);
    if(!m) return 0;
    const n = parseInt(m[1],10);
    const u = m[2].toLowerCase();
    if(u.startsWith('zi')) return n;
    if(u.startsWith('săpt')||u.startsWith('sapt')) return n*7;
    if(u.startsWith('lun')) return n*30;
    if(u.startsWith('an')) return n*365;
    return 0;
}

        // Încarcă primul videoclip FĂRĂ autoplay
        const first = VIDEOS[0];
        document.getElementById('featured-video').src = `https://www.youtube.com/embed/${first.embedId}?rel=0&controls=1&modestbranding=1`;
        document.getElementById('featured-meta').textContent = `${first.title} — ${first.views} • ${first.date}`;
    }
    
    // Sunet cinematic la încărcare
    const intro = document.getElementById('intro-sound');
    if(intro){
        intro.volume = 0.4;
        setTimeout(() => {
            intro.play().catch(()=>{/* autoplay blocked */});
        }, 500);
    }
    
    // Tab-ul "Piese" este activ implicit
    activateTab('songs');
});

// Filters handlers
document.getElementById('filter-recent').addEventListener('click', function(){
    this.classList.add('active');
    document.getElementById('filter-pop').classList.remove('active');
    renderVideos(VIDEOS.slice().sort((a,b)=> parseDays(a.date)-parseDays(b.date)));
});

document.getElementById('filter-pop').addEventListener('click', function(){
    this.classList.add('active');
    document.getElementById('filter-recent').classList.remove('active');
    renderVideos(VIDEOS.slice().sort((a,b)=> parseViews(b.views)-parseViews(a.views)));
});
</script>
</body>
</html>
